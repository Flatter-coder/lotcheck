<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LotCheck — Reviews vs MSRP</title>
<style>
  /* ============ trust-24 · COMPACT WIDGET (~420×420) ============
     Self-contained embeddable card, as if dropped onto a partner site. One
     teal accent for structure; green/red reserved for meaning. */
  :root{
    --card:#101318;
    --hair:rgba(255,255,255,.1);
    --hair-strong:rgba(255,255,255,.18);
    --teal:#3fb9c9;
    --up:#3ecf8e;
    --down:#f0688a;
    --ink:#eef2f7;
    --dim:#8b95a6;
    --dimmer:#5a6474;
    --grid:rgba(255,255,255,.07);
    --star:#c9a24a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05070a;color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

  .widget{width:420px;max-width:100%;background:var(--card);border:1px solid var(--hair);border-radius:16px;
    padding:16px 18px 14px;box-shadow:0 30px 70px -40px rgba(0,0,0,.85)}
  .w-head{display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;justify-content:center;width:34px;height:30px;
    border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--hair);overflow:hidden;flex:none}
  .logo svg{width:28px;height:28px;display:block}
  @keyframes lc-gate-drive{
    0%{transform:translate(-95px,-47px);opacity:0;} 10%{opacity:1;} 50%{transform:translate(0,0);}
    90%{opacity:1;} 100%{transform:translate(95px,47px);opacity:0;}
  }
  @keyframes lc-gate-flash{ 0%,40%{opacity:.22;} 50%{opacity:.68;} 60%,100%{opacity:.22;} }
  .lc-gate-car{animation:lc-gate-drive 4s linear infinite;}
  .lc-gate-window{animation:lc-gate-flash 4s linear infinite;}
  .w-head h1{font-size:13px;font-weight:600;letter-spacing:.2px;line-height:1.1}
  .w-head .sub{font-size:9px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
  .w-head .demo{margin-left:auto;font-size:8.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
    padding:3px 8px;border-radius:12px;border:1px solid var(--hair);color:var(--dim)}

  .chartwrap{position:relative;margin-top:8px}
  svg.matrix{width:100%;height:auto;display:block;overflow:visible}
  .tt{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-118%);
    background:rgba(6,9,13,.97);border:1px solid var(--hair-strong);border-radius:8px;padding:6px 9px;
    font-size:10.5px;white-space:nowrap;transition:opacity .12s;z-index:6}
  .tt .n{font-weight:600;color:var(--ink)} .tt .r{color:var(--dim);margin-top:2px}
  .tt .star{color:var(--star)}

  .caption{display:flex;align-items:center;gap:8px;margin-top:6px;padding:9px 11px;border-radius:10px;
    background:rgba(62,207,142,.09);border:1px solid rgba(62,207,142,.25);font-size:12px}
  .caption .k{color:var(--up);font-weight:700;letter-spacing:.4px;font-size:10px;text-transform:uppercase}
  .caption .v{color:var(--ink);font-weight:600}
  .caption .m{color:var(--dim);margin-left:auto;font-size:11px}
  .foot{margin-top:9px;font-size:9px;color:var(--dimmer);line-height:1.5}
  .foot b{color:var(--dim)} .foot .mono{color:var(--dim)}

  @media (prefers-reduced-motion:reduce){ .lc-gate-car,.lc-gate-window{animation:none!important} }
</style>
</head>
<body>
<div class="widget">
  <div class="w-head">
    <div class="logo" aria-hidden="true" title="LotCheck — passing the check">
      <!-- REAL LotCheck mark, ported verbatim from src/App.jsx LogoMark (viewBox -95 -45 145 130) -->
      <svg viewBox="-95 -45 145 130" xmlns="http://www.w3.org/2000/svg">
        <polygon points="-50,5 100,80 52,104 -98,29" fill="#D9DBEF"/>
        <polygon points="-4,-26 8,-20 -4,-14 -16,-20" fill="rgb(182,171,228)"/>
        <polygon points="-16,22 -4,28 -4,-14 -16,-20" fill="rgb(158,145,210)"/>
        <polygon points="8,22 -4,28 -4,-14 8,-20" fill="rgb(135,124,179)"/>
        <polygon points="-72,8 -60,14 -72,20 -84,14" fill="rgb(182,171,228)"/>
        <polygon points="-84,56 -72,62 -72,20 -84,14" fill="rgb(158,145,210)"/>
        <polygon points="-60,56 -72,62 -72,20 -60,14" fill="rgb(135,124,179)"/>
        <polygon points="1,-38.5 11,-33.5 -77,10.5 -87,5.5" fill="rgb(194,184,235)"/>
        <polygon points="-87,16.5 -77,21.5 -77,10.5 -87,5.5" fill="rgb(172,160,218)"/>
        <polygon points="11,-22.5 -77,21.5 -77,10.5 11,-33.5" fill="rgb(146,136,185)"/>
        <g class="lc-gate-window"><polygon points="6,17 -82,61 -82,17 6,-27" fill="rgba(59,130,246,.4)"/></g>
        <g class="lc-gate-car">
          <polygon points="-13,33.5 40,60 13,73.5 -40,47" fill="rgba(51,48,90,.10)"/>
          <polygon points="-12,25 34,48 12,59 -34,36" fill="rgb(244,150,130)"/>
          <polygon points="-34,44 12,67 12,59 -34,36" fill="rgb(227,123,100)"/>
          <polygon points="34,56 12,67 12,59 34,48" fill="rgb(193,104,85)"/>
          <polygon points="-5,23.5 17,34.5 1,42.5 -21,31.5" fill="rgb(244,150,130)"/>
          <polygon points="-21,39.5 1,50.5 1,42.5 -21,31.5" fill="rgb(227,123,100)"/>
          <polygon points="17,42.5 1,50.5 1,42.5 17,34.5" fill="rgb(193,104,85)"/>
          <polygon points="17,42.5 1,50.5 1,43.5 17,35.5" fill="#E6F4F6"/>
          <polygon points="-18,40 -1,48.5 -1,43.5 -18,35" fill="#DDEDF2"/>
          <polygon points="-25,43.5 -18,47 -22,49 -29,45.5" fill="rgb(98,93,130)"/>
          <polygon points="-29,50.5 -22,54 -22,49 -29,45.5" fill="rgb(64,59,100)"/>
          <polygon points="-18,52 -22,54 -22,49 -18,47" fill="rgb(55,50,85)"/>
        </g>
      </svg>
    </div>
    <div><h1>Reviews vs MSRP</h1><div class="sub">LotCheck</div></div>
    <span class="demo">Demo data</span>
  </div>

  <div class="chartwrap">
    <svg class="matrix" id="mx" viewBox="0 0 388 320" role="img" aria-label="Trust versus price scatter of local dealers"></svg>
    <div class="tt" id="tt"></div>
  </div>

  <div class="caption">
    <span class="k">Lowest price · higher-rated</span>
    <span class="v" id="bvName">—</span>
    <span class="m mono" id="bvMeta"></span>
  </div>
  <div class="foot">◆ <b>Demo — fictional dealers, sample values.</b> X = Google reviews (<span class="mono">get-dealer-sentiment</span>) · Y = listing price vs. <span class="mono">msrp_catalog</span> · dot size = inventory.</div>
</div>

<script>
(function(){
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var DEALERS=[
    {n:"Riverside Motors",     r:2.3, d:+7.4, inv:88},
    {n:"Stampede Auto Group",  r:2.8, d:+6.1, inv:64},
    {n:"Crestline Automotive", r:3.4, d:+4.9, inv:120},
    {n:"Beacon Motors",        r:3.1, d:+3.8, inv:74},
    {n:"Summit Auto",          r:4.7, d:+2.2, inv:150},
    {n:"Northgate Cars",       r:4.4, d:+0.4, inv:132},
    {n:"Meridian Motors",      r:4.6, d:-0.6, inv:141},
    {n:"Foothills Auto",       r:4.5, d:-1.1, inv:118},
    {n:"Redstone Motors",      r:4.2, d:-1.9, inv:92},
    {n:"Chinook Auto",         r:3.9, d:-2.4, inv:80},
    {n:"Nose Hill Auto",       r:4.9, d:-2.7, inv:110},
    {n:"Glenmore Motors",      r:4.8, d:-3.0, inv:70},
    {n:"Bowview Auto",         r:4.7, d:-3.6, inv:98},
    {n:"Prairie Motors",       r:3.6, d:-4.2, inv:60},
    {n:"Elbow River Auto",     r:4.3, d:-5.1, inv:54}
  ];
  function kind(o){ if(o.d>0&&o.r<3.6)return "down"; if(o.d<0&&o.r>=4.2)return "up"; return "neu"; }
  function colOf(k){ return k==="up"?"var(--up)":k==="down"?"var(--down)":"var(--dim)"; }

  var VBW=388,VBH=320, M={L:34,R:16,T:18,B:40};
  var x0=M.L,x1=VBW-M.R,y0=M.T,y1=VBH-M.B;
  var pw=x1-x0,ph=y1-y0,midY=(y0+y1)/2,midX=x0+pw/2,DMAX=8;
  function X(r){return x0+(r-1)/4*pw;}
  function Y(d){return midY-(d/DMAX)*(ph/2);}
  function RAD(inv){return 3.4+inv/34;}

  function draw(){
    var s='<defs>'+
      '<radialGradient id="gG" cx="82%" cy="82%" r="72%"><stop offset="0%" stop-color="var(--up)" stop-opacity=".12"/><stop offset="100%" stop-color="var(--up)" stop-opacity="0"/></radialGradient>'+
      '<radialGradient id="gR" cx="16%" cy="16%" r="72%"><stop offset="0%" stop-color="var(--down)" stop-opacity=".1"/><stop offset="100%" stop-color="var(--down)" stop-opacity="0"/></radialGradient>'+
      '</defs>';
    s+='<rect x="'+midX+'" y="'+midY+'" width="'+(x1-midX)+'" height="'+(y1-midY)+'" fill="url(#gG)"/>';
    s+='<rect x="'+x0+'" y="'+y0+'" width="'+(midX-x0)+'" height="'+(midY-y0)+'" fill="url(#gR)"/>';
    // 0 line + mid trust line
    s+='<line x1="'+x0+'" y1="'+Y(0)+'" x2="'+x1+'" y2="'+Y(0)+'" stroke="var(--hair-strong)" stroke-width="1"/>';
    s+='<line x1="'+midX+'" y1="'+y0+'" x2="'+midX+'" y2="'+y1+'" stroke="var(--hair-strong)" stroke-width="1"/>';
    s+='<text x="'+(x0-6)+'" y="'+(Y(0)+3)+'" fill="var(--dimmer)" font-size="8.5" text-anchor="end" font-family="monospace">MSRP</text>';
    // rating gridlines + star labels
    [1,2,3,4,5].forEach(function(rr){
      var x=X(rr);
      if(rr!==3) s+='<line x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="'+y1+'" stroke="var(--grid)" stroke-width=".7" stroke-dasharray="2 5"/>';
      s+='<text x="'+x+'" y="'+(y1+15)+'" fill="var(--dimmer)" font-size="9" text-anchor="middle" font-family="monospace">'+rr+'★</text>';
    });
    // corner labels + axis
    s+='<text x="'+(x1-4)+'" y="'+(y1-6)+'" fill="var(--up)" font-size="8.5" text-anchor="end" font-weight="700" letter-spacing=".4" opacity=".9">BELOW MSRP ▾</text>';
    s+='<text x="'+(x0+6)+'" y="'+(y0+11)+'" fill="var(--down)" font-size="8.5" text-anchor="start" font-weight="700" letter-spacing=".4" opacity=".75">▴ ABOVE MSRP</text>';
    s+='<text x="'+midX+'" y="'+(VBH-5)+'" fill="var(--dim)" font-size="9" text-anchor="middle" letter-spacing=".3">Google review score →</text>';
    s+='<text transform="translate(11,'+midY+') rotate(-90)" fill="var(--dim)" font-size="9" text-anchor="middle" letter-spacing=".3">price vs MSRP</text>';
    s+='<g id="dots">';
    DEALERS.forEach(function(o,i){
      var k=kind(o),c=colOf(k),cx=X(o.r),cy=Y(o.d),rad=RAD(o.inv);
      s+='<circle class="dot" data-i="'+i+'" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+rad.toFixed(1)+'" '+
         'fill="'+c+'" fill-opacity=".2" stroke="'+c+'" stroke-width="1.3" style="cursor:pointer;transition:fill-opacity .15s"/>';
    });
    s+='</g>';
    return s;
  }

  var svg=document.getElementById("mx");
  svg.innerHTML=draw();
  if(!reduce){
    svg.querySelectorAll(".dot").forEach(function(el,i){
      var cx=el.getAttribute("cx"),cy=el.getAttribute("cy");
      el.animate([{transform:"translate("+(midX-cx)+"px,"+(midY-cy)+"px) scale(.2)",opacity:0},{transform:"none",opacity:1}],
        {duration:600,delay:i*28,easing:"cubic-bezier(.16,1,.3,1)",fill:"backwards"});
    });
  }

  // standout dealer (below MSRP, highest combined rating + discount)
  function fmtd(d){return (d>0?"+":"")+d.toFixed(1)+"%";}
  var best=null,bestScore=-1e9;
  DEALERS.forEach(function(o){ if(o.d<0){var sc=(o.r-1)/4+(-o.d)/8; if(sc>bestScore){bestScore=sc;best=o;}} });
  document.getElementById("bvName").textContent=best.n;
  document.getElementById("bvMeta").innerHTML='<span class="star" style="color:var(--star)">★</span> '+best.r.toFixed(1)+' · '+fmtd(best.d)+' vs MSRP';

  var tt=document.getElementById("tt"), wrap=svg.parentElement;
  svg.querySelectorAll(".dot").forEach(function(el){
    el.addEventListener("mouseenter",function(){el.setAttribute("fill-opacity",".38");});
    el.addEventListener("mouseleave",function(){el.setAttribute("fill-opacity",".2");tt.style.opacity=0;});
    el.addEventListener("mousemove",function(e){
      var o=DEALERS[+el.dataset.i], rc=wrap.getBoundingClientRect();
      tt.innerHTML='<div class="n">'+o.n+'</div><div class="r"><span class="star">★</span> '+o.r.toFixed(1)+' · '+fmtd(o.d)+' · '+o.inv+' stock</div>';
      tt.style.left=(e.clientX-rc.left)+"px"; tt.style.top=(e.clientY-rc.top)+"px"; tt.style.opacity=1;
    });
  });
})();
</script>
</body>
</html>
