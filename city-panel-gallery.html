<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LotCheck — City panels + Alberta map · 26 designs</title>
<style>
  :root{--bg:#07090d;--panel:#0f131b;--hair:rgba(255,255,255,.09);--cyan:#22e3ff;--white:#eaf3ff;--dim:#8794aa;--dimmer:#525d72}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;height:100vh;display:grid;grid-template-columns:310px 1fr;overflow:hidden}
  aside{border-right:1px solid var(--hair);background:var(--panel);height:100vh;overflow-y:auto;padding:16px 0}
  .brand{padding:4px 18px 14px;border-bottom:1px solid var(--hair);margin-bottom:8px}
  .brand h1{font-size:14px;font-weight:600}
  .brand p{font-size:11.5px;color:var(--dim);margin-top:3px}
  .grp{font-size:10.5px;color:var(--dimmer);text-transform:uppercase;letter-spacing:1.4px;padding:12px 18px 5px;font-weight:600}
  a.item{display:flex;gap:10px;align-items:baseline;padding:8px 18px;cursor:pointer;text-decoration:none;color:var(--white);border-left:2px solid transparent;transition:.12s}
  a.item:hover{background:rgba(255,255,255,.03)}
  a.item.on{background:rgba(34,227,255,.09);border-left-color:var(--cyan)}
  a.item .n{font-size:11px;color:var(--dimmer);min-width:22px;font-variant-numeric:tabular-nums}
  a.item.on .n{color:var(--cyan)}
  a.item .t{font-size:12.5px;line-height:1.35}
  a.item .t small{display:block;color:var(--dim);font-size:11px}
  main{display:flex;flex-direction:column;height:100vh}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--hair)}
  .bar .now{font-size:13px;font-weight:600}
  .bar .now small{color:var(--dim);font-weight:400;margin-left:8px}
  .bar .sp{flex:1}
  .bar button,.bar a.open{font:inherit;font-size:12px;color:var(--white);background:transparent;border:1px solid var(--hair);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;transition:.12s}
  .bar button:hover,.bar a.open:hover{border-color:var(--cyan);color:var(--cyan)}
  .frame{flex:1;background:#000}
  iframe{width:100%;height:100%;border:0;display:block;background:#07090d}
  .count{font-size:11px;color:var(--dimmer)}
</style>
</head>
<body>
<aside id="side"></aside>
<main>
  <div class="bar">
    <div class="now" id="now">—</div><div class="sp"></div>
    <span class="count" id="count"></span>
    <button id="prev">← Prev</button><button id="next">Next →</button>
    <a class="open" id="open" target="_blank">Open full ↗</a>
  </div>
  <div class="frame"><iframe id="view" title="preview"></iframe></div>
</main>
<script>
  var ITEMS=[
    {g:"Map",n:"★",f:"map-3d-alberta.html",t:"3D terrain map",d:"Alberta, tilted relief, animated pins"},
    {g:"Layouts",n:"01",f:"city-panel-01.html",t:"Stat-first",d:"Big number tiles + small chart"},
    {g:"Layouts",n:"02",f:"city-panel-02.html",t:"Chart-first",d:"Reviews-vs-MSRP hero"},
    {g:"Layouts",n:"03",f:"city-panel-03.html",t:"Split",d:"Stats left, chart right"},
    {g:"Layouts",n:"04",f:"city-panel-04.html",t:"Stacked cards",d:"Each block its own card"},
    {g:"Layouts",n:"05",f:"city-panel-05.html",t:"Compact card",d:"Everything in one 440px card"},
    {g:"Comparison-forward",n:"06",f:"city-panel-06.html",t:"$ vs a city",d:"≈$1,240 closer than Fort Mac"},
    {g:"Comparison-forward",n:"07",f:"city-panel-07.html",t:"Rank of 33",d:"4th-closest to MSRP"},
    {g:"Comparison-forward",n:"08",f:"city-panel-08.html",t:"Nearby city + drive",d:"Closer-to-MSRP town, hrs away"},
    {g:"Comparison-forward",n:"09",f:"city-panel-09.html",t:"vs provincial avg",d:"Diverging bar off AB average"},
    {g:"Comparison-forward",n:"10",f:"city-panel-10.html",t:"Top-3 cities",d:"Closest-to-MSRP table"},
    {g:"Viz styles",n:"11",f:"city-panel-11.html",t:"Mini-scatter",d:"Reviews vs MSRP compact"},
    {g:"Viz styles",n:"12",f:"city-panel-12.html",t:"Ranked bars",d:"Dealers off MSRP centre line"},
    {g:"Viz styles",n:"13",f:"city-panel-13.html",t:"Radial gauge",d:"City price-vs-MSRP dial"},
    {g:"Viz styles",n:"14",f:"city-panel-14.html",t:"Dot-strip",d:"Beeswarm along the axis"},
    {g:"Viz styles",n:"15",f:"city-panel-15.html",t:"Histogram",d:"Distribution of price-vs-MSRP"},
    {g:"Density",n:"16",f:"city-panel-16.html",t:"Ultra-minimal",d:"City + comparison + tiny viz"},
    {g:"Density",n:"17",f:"city-panel-17.html",t:"Glanceable",d:"Comparison delta as hero number"},
    {g:"Density",n:"18",f:"city-panel-18.html",t:"Mobile card",d:"390px stacked, thumb-friendly"},
    {g:"Density",n:"19",f:"city-panel-19.html",t:"Rich (organized)",d:"Power-user detail, tidy"},
    {g:"Density",n:"20",f:"city-panel-20.html",t:"Dashboard tile",d:"360×300 embeddable module"},
    {g:"Palettes",n:"21",f:"city-panel-21.html",t:"Dark premium",d:"Cyan accent"},
    {g:"Palettes",n:"22",f:"city-panel-22.html",t:"Clean light",d:"Warm white"},
    {g:"Palettes",n:"23",f:"city-panel-23.html",t:"Mono contrast",d:"Meaning via tint only"},
    {g:"Palettes",n:"24",f:"city-panel-24.html",t:"Amber (dark)",d:"Gold accent"},
    {g:"Palettes",n:"25",f:"city-panel-25.html",t:"Light editorial",d:"Navy on paper, serif"}
  ];
  var cur=0, side=document.getElementById("side"), view=document.getElementById("view");
  document.getElementById("count").textContent=ITEMS.length+" designs";
  var html='<div class="brand"><h1>City panels + Alberta map</h1><p>Per-city MSRP vs local dealers · real logo in each</p></div>', lastG=null;
  ITEMS.forEach(function(it,i){ if(it.g!==lastG){html+='<div class="grp">'+it.g+'</div>';lastG=it.g;}
    html+='<a class="item" data-i="'+i+'"><span class="n">'+it.n+'</span><span class="t">'+it.t+'<small>'+it.d+'</small></span></a>';});
  side.innerHTML=html;
  function show(i){cur=(i+ITEMS.length)%ITEMS.length; var it=ITEMS[cur];
    view.src=it.f; document.getElementById("now").innerHTML=it.t+' <small>'+it.g+' · '+it.d+'</small>';
    document.getElementById("open").href=it.f;
    document.querySelectorAll("a.item").forEach(function(a){a.classList.toggle("on", +a.dataset.i===cur);});
    var on=document.querySelector("a.item.on"); if(on)on.scrollIntoView({block:"nearest"});}
  side.addEventListener("click",function(e){var a=e.target.closest("a.item"); if(a)show(+a.dataset.i);});
  document.getElementById("prev").onclick=function(){show(cur-1);};
  document.getElementById("next").onclick=function(){show(cur+1);};
  document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1);});
  show(0);
</script>
</body>
</html>
