# Founder cost statement — emails each founder their share on the 1st.
#
# Timed on purpose: the two fixed debits land on the 8th (Claude subscription)
# and the 10th (Scrapfly), so a statement on the 1st gives a week of notice
# before the first one rather than arriving after the money has gone.
#
# 13:00 UTC = 06:00 Mountain in summer, 07:00 in winter. Deliberately not
# midnight UTC: that is the 30th/31st of the previous month in Alberta, and a
# statement headed "September" arriving on 31 August is confusing.
#
# THIS CRON CANNOT SEND ANYTHING. It calls mode=stage, which computes the
# statement and records it as pending_approval. Vic approves it in the admin
# panel; only that turns it into something the send path will deliver.
#
# Vic, 2026-08-14: "before you send, you need permission from me — because if
# our cost jumps we need to adjust invoices." A vendor bill that moves between
# the 1st and the send would otherwise bill JC and Josh the wrong amount, and a
# number sent to a co-founder has been acted on by the time anyone notices.
#
# Secret: STATEMENT_SECRET (matching the function's).
name: Founder statement

on:
  schedule:
    # 1st of the month, 13:00 UTC = 06:00 Mountain. Staging only.
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "stage = compute + hold for approval (safe). send = deliver an ALREADY-APPROVED run."
        type: choice
        options: [stage, send]
        default: stage

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stage (or send an approved) statement
        env:
          STATEMENT_SECRET: ${{ secrets.STATEMENT_SECRET }}
        run: |
          # A scheduled run ALWAYS stages. There is no input the cron can carry
          # that would make it send -- the only way to send is a manual run
          # against a statement already approved in the panel.
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="stage"; fi
          echo "mode=$MODE"

          URL="https://debigtyjhjamipooajhk.supabase.co/functions/v1/founder-statement?mode=$MODE"
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST "$URL" \
            -H "x-statement-secret: $STATEMENT_SECRET" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $CODE"
          head -c 4000 /tmp/out.json; echo

          # 409 is the deliberate refusal (shares do not total 10000), not a
          # fault -- surface it loudly but do not fail the run, or a red cron
          # every month becomes noise that gets ignored.
          if [ "$CODE" = "409" ]; then
            echo "::warning::Statement refused -- founder shares do not total 10000 bps."
            exit 0
          fi
          [ "$CODE" = "200" ] || exit 1

          if [ "$MODE" = "stage" ]; then
            echo "::notice::Statement staged and awaiting Vic's approval. Nothing has been emailed."
          fi
