name: Catalog rates (daily)
# Refreshes ONLY finance_rate_catalog + lease_rate_catalog for the makes that
# expose rates. CATALOG_RATES_ONLY=1 makes each scraper skip the msrp_catalog
# write, so MSRP is left to the weekly full run (catalog-refresh.yml). Rates
# track monthly promo periods that can shift mid-month, so refresh them daily.
# MSRP-only makes (GM, Ford, Kia, Nissan, Volvo, Porsche, Mercedes) are omitted
# here — they produce no rate rows.
#
# Each make runs as its OWN matrix job with fail-fast:false, so one OEM changing
# or removing an endpoint (e.g. Genesis 404) can never abort the others — every
# reachable make still refreshes. A broken make shows as a single red leg (which
# needs its scraper fixed), not a failed run that skips everyone after it.
on:
  workflow_dispatch:
  schedule:
    # TWICE DAILY (Vic 2026-09-25: every catalogue at 6am and midnight Calgary).
    # 06 and 12 UTC are midnight and 6am MDT (an hour earlier in MST). GitHub
    # starts these hours late, so the exact-time trigger is a separate step.
    - cron: "7 6,12 * * *"
jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Toyota, script: scrape-toyota.mjs, makes: "Toyota" }
          - { name: Lexus, script: scrape-lexus.mjs, makes: "Lexus" }
          - { name: Stellantis, script: scrape-stellantis.mjs, makes: "Jeep,Ram,Dodge,Chrysler,Fiat,Alfa Romeo" }
          - { name: Genesis, script: scrape-genesis.mjs, makes: "Genesis" }
          - { name: Hyundai, script: scrape-hyundai.mjs, makes: "Hyundai" }
          - { name: Mazda, script: scrape-mazda.mjs, makes: "Mazda" }
          - { name: Honda, script: scrape-honda.mjs, makes: "Honda" }
          - { name: Acura, script: scrape-acura.mjs, makes: "Acura" }
          - { name: MINI, script: scrape-mini.mjs, makes: "Mini" }
          - { name: Subaru, script: scrape-subaru.mjs, makes: "Subaru" }
          - { name: Volkswagen, script: scrape-vw.mjs, makes: "Volkswagen" }
          - { name: BMW, script: scrape-bmw.mjs, makes: "BMW" }
          - { name: Mercedes-Benz, script: scrape-mercedes-rates.mjs, makes: "Mercedes-Benz" }
          - { name: Ford, script: scrape-ford-rates.mjs, makes: "Ford" }
          - { name: Nissan, script: scrape-nissan-rates.mjs, makes: "Nissan" }
          - { name: Infiniti, script: scrape-infiniti-rates.mjs, makes: "Infiniti" }
          - { name: GM, script: scrape-gm-rates.mjs, makes: "Chevrolet,GMC,Buick" }
    name: ${{ matrix.name }} rates
    env:
      CATALOG_RATES_ONLY: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Snapshot this make's catalogue rows
        run: node scripts/catalog-refresh-guard.mjs snapshot
      - name: ${{ matrix.name }} rates
        id: scrape
        continue-on-error: true
        run: node scripts/${{ matrix.script }}
      # GREEN MUST MEAN "WROTE FRESH RATES", not "did not crash": a scrape that
      # finds nothing exits 0 and leaves the old rows. The guard compares
      # against the snapshot; its outcome is this make's line in the tally.
      - name: "Guard: ${{ matrix.name }} wrote fresh rate rows"
        id: verify
        continue-on-error: true
        run: node scripts/catalog-refresh-guard.mjs verify --step="${{ matrix.name }} rates" --makes="${{ matrix.makes }}" --finance=required --lease=optional
      - name: Tally line
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/leg"
          echo "${{ matrix.name }}|${{ steps.verify.outcome }}" > "$RUNNER_TEMP/leg/${{ strategy.job-index }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apr-leg-${{ strategy.job-index }}
          path: ${{ runner.temp }}/leg/
          retention-days: 3

  # The daily report's check mark (20260925_catalog_status.sql), from the legs'
  # own guard outcomes: green only when every make wrote fresh rates; a leg
  # that left no tally line counts as not refreshed.
  record-status:
    needs: rates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: apr-leg-*
          path: ${{ runner.temp }}/legs
          merge-multiple: true
      - name: Record catalogue status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/apr-tally.mjs "$RUNNER_TEMP/legs" .github/workflows/catalog-rates-daily.yml > "$RUNNER_TEMP/apr.json"
          cat "$RUNNER_TEMP/apr.json"
          node scripts/record-catalog-status.mjs --catalog apr_new --outcome ${{ needs.rates.result }} --summary "$RUNNER_TEMP/apr.json" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
