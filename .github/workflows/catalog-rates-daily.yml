name: Catalog rates (daily)
# Refreshes ONLY finance_rate_catalog + lease_rate_catalog for the makes that
# expose rates. CATALOG_RATES_ONLY=1 makes each scraper skip the msrp_catalog
# write, so MSRP is left to the weekly full run (catalog-refresh.yml). Rates
# track monthly promo periods that can shift mid-month, so refresh them daily.
# MSRP-only makes (GM, Ford, Kia, Nissan, Volvo, Porsche, Mercedes) are omitted
# here — they produce no rate rows.
#
# Each make runs as its OWN matrix job with fail-fast:false, so one OEM changing
# or removing an endpoint (e.g. Genesis 404) can never abort the others — every
# reachable make still refreshes. A broken make shows as a single red leg (which
# needs its scraper fixed), not a failed run that skips everyone after it.
on:
  workflow_dispatch:
  schedule:
    # TWICE DAILY (Vic 2026-09-25: every catalogue at 6am and midnight Calgary).
    # 06 and 12 UTC are midnight and 6am MDT (an hour earlier in MST). GitHub
    # starts these hours late, so the exact-time trigger is a separate step.
    - cron: "7 6,12 * * *"
jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Toyota,        script: scrape-toyota.mjs }
          - { name: Lexus,         script: scrape-lexus.mjs }
          - { name: Stellantis,    script: scrape-stellantis.mjs }
          - { name: Genesis,       script: scrape-genesis.mjs }
          - { name: Hyundai,       script: scrape-hyundai.mjs }
          - { name: Mazda,         script: scrape-mazda.mjs }
          - { name: Honda,         script: scrape-honda.mjs }
          - { name: Acura,         script: scrape-acura.mjs }
          - { name: MINI,          script: scrape-mini.mjs }
          - { name: Subaru,        script: scrape-subaru.mjs }
          - { name: Volkswagen,    script: scrape-vw.mjs }
          - { name: BMW,           script: scrape-bmw.mjs }
          - { name: Mercedes-Benz, script: scrape-mercedes-rates.mjs }
          - { name: Ford,          script: scrape-ford-rates.mjs }
          - { name: Nissan,        script: scrape-nissan-rates.mjs }
          - { name: Infiniti,      script: scrape-infiniti-rates.mjs }
          - { name: GM,            script: scrape-gm-rates.mjs }
    name: ${{ matrix.name }} rates
    env:
      CATALOG_RATES_ONLY: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ${{ matrix.name }} rates
        continue-on-error: true
        run: node scripts/${{ matrix.script }}

  # The daily report's check mark (20260925_catalog_status.sql). Each make's
  # leg above is continue-on-error, so a green job result cannot say every
  # make refreshed -- recorded AMBER with that reason until the legs are tallied.
  record-status:
    needs: rates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record catalogue status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo '{"state":"amber","unit":"makes","covered":null,"of_total":17,"note":"Maker finance rates were re-read for 17 makes; each make is allowed to fail on its own, and which ones did is not tallied yet."}' > "$RUNNER_TEMP/apr.json"
          node scripts/record-catalog-status.mjs --catalog apr_new --outcome ${{ needs.rates.result }} --summary "$RUNNER_TEMP/apr.json" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
