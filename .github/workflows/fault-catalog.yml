# Reported-faults catalogue — ONCE daily, deliberately.
#
# Every other catalogue in this repo runs 6am and midnight because Vic's rule is
# twice a day. This one runs once, and the reason is upstream, not convenience:
#
#   NHTSA rewrites its complaint slices roughly once a day around 09:2x GMT, and
#   not every slice every day. Measured 2026-09-14, the seven Last-Modified dates
#   spanned 2026-08-09 to 2026-09-11 — one slice 36 days stale while NHTSA's own
#   page advertised daily updates. A midnight run would re-ask a question whose
#   answer cannot have changed.
#
#   And it would not be free. Both static.nhtsa.gov and api.nhtsa.gov sit behind
#   one Akamai property that answers overload with HTTP 403 and an HTML page —
#   no 429, no Retry-After. Recovery took 600 seconds of TOTAL silence; polite
#   retrying at 1 req/5s stayed blocked for 304s and did not clear. So a second
#   daily run doubles the ban exposure to buy nothing.
#
# 10:30 UTC, an hour after NHTSA's usual write, so a slice published this morning
# is picked up the same day. The job asks seven conditional questions; on a quiet
# day all seven answer 304 and nothing is downloaded.
name: Reported-faults catalogue (daily)

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and report, write nothing"
        type: boolean
        default: false

concurrency:
  group: fault-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20. @supabase/supabase-js needs a global WebSocket, which
          # Node gained at 22; on 20 it throws "Node.js detected but native
          # WebSocket not found" the moment a client is constructed. This job
          # spent ten minutes parsing 1.6 million complaints and died on that
          # line. Every other workflow in this repo was already on 22 or 24 --
          # this one was the only 20, written from habit rather than from the
          # repo. check:jobs now enforces the floor.
          node-version: "24"

      # THE FIRST SCHEDULED RUN DIED HERE, 2026-09-15. It downloaded all seven
      # slices, parsed 2,158,800 rows into 1,587,434 complaints across 31,257
      # cells -- and then could not write them, because nothing had ever
      # installed @supabase/supabase-js. Ten minutes of correct work thrown
      # away on the last line.
      #
      # It could not have been caught before it ran: every gate for this feature
      # is a pure unit test that imports no client, and the local build was only
      # ever exercised with --dry-run, which returns before the database is
      # touched. A job whose one untested step is its last one fails at the end
      # or not at all. [[repeat-fix-pattern]]
      - name: Install
        run: npm ci --no-audit --no-fund

      # The slice cache makes the conditional request worth making: an unchanged
      # slice is read from disk instead of the wire, so a quiet day moves no
      # bytes at all. A cache miss just means a full download, which is correct
      # and costs about thirty seconds.
      - name: Restore NHTSA slice cache
        uses: actions/cache@v4
        with:
          path: .nhtsa-cache
          key: nhtsa-slices-${{ github.run_id }}
          restore-keys: nhtsa-slices-

      - name: Build the catalogue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --max-old-space-size=6144 scripts/build-fault-catalog.mjs \
            --cache .nhtsa-cache \
            ${{ inputs.dry_run && '--dry-run' || '' }}

# A red run IS the report. Nothing here emails anyone, and the build already
# prints every slice's upstream date on its way through, so there is no separate
# reporting step to go stale. [[never-send-without-approval]]
