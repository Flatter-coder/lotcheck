# Regression gates — the two deterministic checks that must hold on every push.
#
#   test:invariants  Pure gates over the analysis object (_shared/invariants.ts):
#                    price-disclosure consistency, the accusation gate, VIN check
#                    integrity, MSRP basis + provenance. These are the rules that
#                    keep a report from making a claim it can't back.
#   check:parity     Client-derived report cards must render on EVERY view. The
#                    EVAP rebate is computed on the client, and two surfaces
#                    derived it while two read a server field that is never set
#                    — so a BEV showed a dead "—" on the panel while the scroll
#                    view showed the real rebate. Pins the shared resolver.
#   check:copy       Forbidden and count-pinned claims in shipped copy: paused
#                    regulatory-status language, scrape vocabulary, absolute
#                    accuracy promises, and the two condition-bound claims
#                    ("never stored", "10-point") whose truth depends on a
#                    system state that can change.
#   test:jsonld-vehicle  schema.org Vehicle/Offer read (_shared/jsonld-vehicle.js)
#                    and the scrapfly.ts vision-rescue merge (fillFromJsonLd):
#                    when a dealer page's screenshot blows Claude vision's size
#                    ceiling and the vision/text pass returns nothing, this is
#                    what still recovers the listing from the page's own
#                    structured data (capitalchev.ca, 2026-08-13).
#   test:convertus-vms  Convertus platform vehicle-data read (_shared/
#                    convertus-vms.js): the "/vehicles/YYYY/..." dealer family
#                    embeds price/MSRP/VIN in a `var vmsData = {...}` blob that
#                    carries NO schema.org JSON-LD on many of its themes, so
#                    the JSON-LD gate above never covers it. A real, correctly-
#                    scraped page reported "price not shown" and a wrong
#                    generic MSRP while this exact data sat unread the whole
#                    time (southtrailkia.com, 2026-08-13).
#   test:d2c-vdp     D2C Media platform vehicle-data read (_shared/d2c-vdp.js):
#                    a `window.__vdpJSON = {...}` blob, D2C's analogue of
#                    Convertus's vmsData. The platform templates a "Call for
#                    pricing" lead-capture message over the price fields it
#                    RENDERS while priceWithoutCustomFees keeps the real ask —
#                    specified 2026-08-15 (Okotoks Toyota RAV4 PHEV GR Sport,
#                    $85,995), never actually wired into the pipeline, hit
#                    live again on the SAME listing 2026-08-22.
#
# All three are offline and take milliseconds — no network, no clock, no
# secrets, and no npm install, because none uses a dependency. There is no
# reason for this workflow to be slow or flaky, so a red run always means a
# real regression.
#
# NOT included: test:recalls. It queries Transport Canada live, so putting it on
# every push would hammer a government API and make the signal weather-dependent.
# Run it by hand when touching recall code (it self-SKIPs when TC is unreachable).
# That exclusion is why it sat red on main for a week after aa6183a — nothing was
# watching the one gate nothing runs.
#
# test:recall-sweep IS included: it is the offline contract for the daily recall
# sweep and touches no network at all (stub fetch throughout). The daily job runs
# it again as its own first step, so a broken sweep cannot reach the registry.
name: Gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"      # --experimental-strip-types runs the .ts suite directly
      # Cheapest possible check, first. A patch to fca-stack.mjs once wrote a
      # literal newline inside a template literal, so the file could not be
      # parsed at all -- and nothing caught it, because the build only compiles
      # src/ and the gate suite runs only some scripts. It shipped, and the
      # daily catalog refresh found it the next morning by taking down Jeep,
      # Ram, Dodge and Chrysler with SyntaxError.
      - name: Every script parses
        run: npm run check:syntax
      - name: Invariants (analysis object)
        run: npm run test:invariants
      - name: Sealed capture (parse/magic-byte/page-count gates)
        run: npm run test:capture
      # One transient 504 must never kill a make's daily refresh (Mercedes,
      # 2026-08-19): scraper fetches retry bounded on 5xx/429/network only.
      - name: Scraper fetch retry (5xx/429 bounded backoff)
        run: npm run test:fetch-retry
      # The report-email endpoint is unauthenticated: its ONLY proof that a real
      # scan happened is the ECDSA signature gate. A regression there reopens an
      # open mail relay on our own DKIM-signed domain, so it blocks like a
      # correctness defect, not an advisory.
      - name: Report auth (proof-of-scan gate on the email relay)
        run: npm run test:report-auth
      # canonicalReport() exists twice -- report-sign.ts signs it, App.jsx
      # rebuilds it on the unsigned fallback path -- and only a code comment
      # said the two must match. They had already drifted: 4e3a733 added fcx
      # and source to the client copy alone, so the finance-contingent flag
      # was COMPUTED server-side and never projected into the signed record,
      # and so could not show on /verify for any real report.
      - name: Canonical report parity (the signed shape matches the client copy)
        run: npm run check:canonical
      - name: Flywheel fee-vocab (join keys + de-identification invariant)
        run: npm run test:flywheel
      - name: Copy compliance (shipped claims)
        run: npm run check:copy
      # The powertrain panel reports COVERAGE of a skewed 36% subset, so any
      # part-to-whole geometry lets a reader turn it into a market share. It also
      # pins the class prefix: the bar was once <span class="track">, which
      # inherited the ticker's marquee and dragged every bar sideways.
      # The daily Transport Canada sweep must never report "no new recalls" when
      # there are some. TC caps a response with no count and no "hasMore" flag —
      # at the default the cap hides 43% of Toyota's recalls — so completeness has
      # to be proven, an unreadable make must stay unreadable rather than become
      # zero, and the job stages what it finds without ever sending it.
      - name: Recall sweep (completeness, fail-safe, stages but never sends)
        run: npm run test:recall-sweep
      # Four copies of the Transport Canada lookup drifted apart, and the only
      # correct one was the module nothing imported -- so its regression harness
      # proved nothing about what shipped. One declaration, every consumer
      # reaching it by import, and a clean bill that the REGISTRY backs rather
      # than our own catalogue.
      - name: Recall lookup (single source, registry-backed clean bill)
        run: npm run test:recall-source
      - name: Price-index panel (coverage, not market share)
        run: npm run test:price-index
      # The public market read anchors to OUR catalog, and the moment our
      # number is the reference a freight-basis mistake becomes a fabricated
      # markup claim. This pins the window math: a freight-sized gap over an
      # ex-freight row is indeterminate, never "over"; every published
      # percentage is a floor; indeterminates never buy the k-anonymity gate.
      - name: Market vs catalog (basis-aware window calls, floors, publish gate)
        run: npm run test:market-catalog
      - name: Report parity (client-derived cards render on every view)
        run: npm run check:parity
      - name: Scan accuracy (MSRP-basis label, ground-truth price-gate, consent-overlay strip)
        run: npm run check:scan-accuracy
      # The two MSRP suites guard the same defect from both ends: trim-match
      # decides whether a catalog row may be called "exact", msrp-authority
      # decides whether an over-MSRP gap may be called inflation. Both existed
      # and neither ran anywhere, which is how the Mach-E accusation shipped.
      - name: Trim match (catalog row -> the right trim, honestly labelled)
        run: npm run test:trim
      - name: MSRP authority (inflation callout thresholds)
        run: npm run test:msrp-authority
      # The fee catalog behind an all-in price. Locks the sourced fee constants
      # to their Build & Price captures -- the load-bearing invariant is Toyota
      # RAV4 financed adds = $3,078, so a silent edit to any component fails here.
      - name: Fee catalog (sourced fee constants; no fabricated brand fees)
        run: npm run test:fee-schedule
      # The dealer-fee-ceiling flag: fires ONLY for a new vehicle of a captured
      # make in-province; never a used car, an uncaptured make, or a fee under
      # the ceiling. A wrong fee claim against a named dealer is what this guards.
      - name: Doc-fee ceiling flag (backed, new-only, no false claims)
        run: npm run test:docfee
      # CPO program catalog: verifies a "certified" badge against the OEM program;
      # an uncataloged make must return null (never a false "in-house" cry) and an
      # eligibility concern fires only for an official threshold clearly exceeded.
      - name: CPO catalog (certified-claim verification, no false accusations)
        run: npm run test:cpo
      # Sale-condition granularity (new/demo/certified/used). A demo signal never
      # gets swallowed as plain used; a certified badge never upgrades a new car.
      - name: Sale-condition granularity (new/demo/certified/used)
        run: npm run test:condition
      - name: Catalog carry-forward (a refresh must not wipe enrichment)
        run: npm run test:carry-forward
      - name: Catalog guard verdicts (green must mean "wrote fresh rows")
        run: npm run test:catalog-guard
      # Two rules about how catalog data reaches Supabase. Every scraper must
      # write through writeCatalogs(), because three bare awaits mean an MSRP
      # refusal silently discards the finance and lease rows already in hand --
      # tci-stack and fca-stack kept hand-rolled copies and so kept that bug.
      # And the Toyota/Lexus platform must write NO msrp_catalog rows at all:
      # its price endpoint returns a province-calculated figure (12 distinct
      # values across 13 provinces for one vehicle), so no filter makes it an
      # MSRP -- the old whole-dollar test even ADMITTED 7 calculated rows.
      - name: Catalog writes (helper-only, and no calculated price stored as MSRP)
        run: npm run test:catalog-writes
      - name: Build & Price gate (a premium colour must never seed as trim MSRP)
        run: npm run test:bp-summary
      # Toyota/Lexus catalog overrides: the series-level fuel tag stored the gas
      # TX 350 trims as Hybrid and named the base "Premium" not "Luxury", so a
      # TX 350 Luxury listing resolved to $81,484. Locks the hand-seed + guard.
      - name: TCI catalog overrides (Lexus TX fuel/trim fix)
        run: npm run test:tci-overrides
      # Value-report signing canonical: locks canonicalValueReport (t:'value',
      # asking-band + CPO + recalls + warranty, additive) AND proves the quote
      # canonical stays byte-identical, so signatures/verify never silently drift.
      - name: Value-report signing canonical (value + quote-unchanged)
        run: npm run test:value-canonical
      - name: Supersede must carry enrichment (replaceRows end-to-end)
        run: npm run test:supersede
      - name: Migration columns exist (a 42703 must not reach the SQL editor)
        run: npm run check:migrations
      - name: Every seeded model is reachable by the lookup
        run: npm run test:reachable
      - name: Report truth (never a claim the pipeline did not check)
        run: npm run test:report-truth
      - name: Vision image limits (never post an image the API will refuse)
        run: npm run test:vision-limits
      - name: Scrapfly render degrades instead of losing the HTML
        run: npm run test:scrapfly-render
      - name: Reference financing (no dealer terms -> do the math)
        run: npm run test:ref-financing
      - name: Stacked incentives (real captured dealer pages)
        run: npm run test:incentives
      - name: Finance-contingent pricing (S37)
        run: npm run test:finance-contingent
      - name: JSON-LD vehicle extraction + scrapfly-rescue merge (structured-data fallback)
        run: npm run test:jsonld-vehicle
      # Go Auto is 70+ dealerships across AB and BC behind ONE endpoint, and
      # every one was invisible to us: the probe guesses /new/, they serve
      # /vehicles. Each card names its dealership AND city -- the attribution
      # the price index has been starving for -- so a silent parser regression
      # here would quietly empty whole cities rather than fail loudly.
      - name: Go Auto inventory (one endpoint, every store, city attached)
        run: npm run test:goauto
      - name: Convertus vmsData vehicle extraction (structured-data fallback)
        run: npm run test:convertus-vms
      # D2C Media's window.__vdpJSON: specified 2026-08-15, never wired in --
      # confirmed live TWICE on the same listing (Okotoks Toyota RAV4 PHEV,
      # 2026-08-15 and 2026-08-22) before this gate existed. See d2c-vdp.js.
      - name: D2C Media vdpJSON vehicle extraction (gated-price recovery)
        run: npm run test:d2c-vdp
      # Uploading a screenshot is the primary path (screenshot-first), and
      # Claude hard-rejects a single image over ~5MB -- the client used to send
      # raw bytes up to 15MB, so every upload in that band was a guaranteed
      # failure surfacing as a generic error card. This pins the geometry that
      # keeps a tall page both readable and inside the limit.
      - name: Vision tiling geometry (uploaded screenshots stay readable and in-budget)
        run: npm run test:vision-tiling
      # The IONIQ 9 defamation, second occurrence. The 2026-08-13 fix landed on
      # the LISTING path only; a dealer red-team found the identical accusation
      # still live on the UPLOAD path, which carried its own unguarded copy and
      # imported none of the shared MSRP modules. Both paths now share one rule:
      # only an exact trim match may displace a dealer's stated MSRP or support
      # an inflation callout. This pins that on the upload side specifically.
      - name: Quote-path MSRP authority (a catalog floor is never an accusation)
        run: npm run test:quote-msrp
      # Per-checkpoint outcomes decide whether the admin ledger tells the truth.
      # The rate they feed excludes exactly one outcome -- not_applicable -- so
      # that outcome is the only way a hollow report could go back to reading as
      # a complete one. These cases pin it to positive facts (a gas car has no EV
      # rebate) and prove absence can never buy it: an empty analysis must
      # produce zero green AND zero n/a checkpoints.
      - name: Verification checkpoints (unmeasured is not passing)
        run: npm run test:checkpoints
      # The benchmark measures coverage; the golden set measures CORRECTNESS —
      # every value graded against an answer key read independently off the
      # dealer's own page. This gate locks the grading semantics (a false
      # price-gating accusation must fail the whole report; a text-confidence
      # key value must never grade; a hybrid must never match its gas sibling)
      # and schema-validates the committed answer keys. All three shipped
      # false accusations were caught by a human — this is the machine's turn.
      - name: Golden-set grader (correctness, not coverage)
        run: npm run test:golden
      # Locks the dealer-APR trust gate: buildCounterScript and
      # computeFinancingTrap may only turn a dealer's rate into an
      # accusatory claim (counter-script line, dollar-savings estimate) when
      # it carries real evidence. An LLM-only "25%" once accused a dealer of
      # a $23,275 markup on a page with no APR anywhere (easytermauto.ca).
      - name: Dealer-APR trust gate (deal.ts)
        run: npm run test:deal
      # The panel above is only as good as its window. An open-ended sentinel
      # end serialised to year 275760, Postgres refused to parse it, and all
      # 13 checkpoints read "read failed" on every rolling window while the
      # calendar view worked -- which sent us hunting grants, migrations and
      # identity for days. Now clamped at the boundary and banned at source.
      - name: Query windows (no Date Postgres cannot parse)
        run: npm run test:pg-timestamp
      # An emoji renders as whatever glyph the device ships, so the same report
      # looked like a different product on Android than on macOS -- and a report
      # a dealer may dispute has to be the same artifact everywhere. 95 sites
      # were swept at once; without this they come back one card at a time.
      - name: No emoji in shipped UI (checkmarks and typography allowed)
        run: npm run check:no-emoji
      # A gradient id that does not resolve paints NOTHING -- the icon vanishes
      # while everything around it still renders, so a broken warning icon reads
      # as "no warning here". Also pins public/icons3d.css to the module, since
      # the static pages keep their own copy of the keyframes.
      - name: 3D icons (refs resolve, motion declared, no stylesheet drift)
        run: npm run test:icons3d
      # An MSRP figure carries a BASIS, and only "exact" -- a verified
      # manufacturer price for THIS trim -- may support an over/under claim.
      # App.jsx always enforced that; the EMAIL did not, so a used vehicle's
      # original-when-new MSRP rendered "$28,400 under MSRP" on the emailed
      # cover while the PDF inside the same email refused the same claim. The
      # email is the artifact that gets forwarded to the dealer. One rule now
      # lives in _shared/msrp-claim.ts and every surface asks it; no surface may
      # do the subtraction itself.
      - name: MSRP claim gate (only an exact-trim basis may accuse)
        run: npm run test:msrp-claim
      # Alberta-only access. The gate has to fail in the RIGHT direction: IP
      # geolocation routinely misplaces Albertans (carriers backhaul through
      # other provinces), and a blocked customer never tells you. So an unknown
      # region, a missing secret and an absent token all SERVE, while a forged
      # region token is rejected — the browser may not claim its own province,
      # because the analyze functions spend real vendor money.
      - name: Region gate (fails open for Albertans, closed to forgery)
        run: npm run test:region-gate
      # A powertrain variant is a DIFFERENT VEHICLE, not a trim. A BEV was once
      # reported at the gasoline model's sticker because the base-model resolver
      # strips prefixes. Dealers write HEV and PHEV, and "Plug-in Hybrid"
      # contains "Hybrid", so the stronger claim has to win — on the 2026 RAV4
      # that single distinction is $5,500 (XSE: $50,900 hybrid vs $56,400
      # plug-in). This guard was written 2026-08-12 and sat unmerged until
      # 2026-08-15; it is gated now so it cannot go missing again.
      - name: Model identity (a PHEV never inherits a hybrid's MSRP)
        run: npm run test:model-identity
      # A logic fix that ships without a CACHE_VER bump is a fix nobody sees.
      # Cached reports are keyed by it, so the stored report is replayed —
      # same figures, same report id — and it looks exactly like a failed
      # deploy. Cost half an hour on 2026-08-15 hunting a bug that was already
      # fixed. Needs full history for the merge-base diff.
      - name: Cache version bumped when analysis output changed
        run: npm run check:cache-ver
      # Two promises to the buyer that are control flow, not data: a report
      # email always carries the report, and nobody is charged for a report we
      # couldn't build. The first was broken in production (the PDF build was
      # wrapped in a catch that logged and sent the email anyway, so buyers got
      # an empty report and we never found out). test:delivery mutation-tests
      # the gate itself, so a weakened gate goes red instead of quietly passing.
      - name: Delivery guarantees (PDF always attached, empty report never charged)
        run: npm run check:delivery
      - name: Delivery gate is load-bearing (mutation test)
        run: npm run test:delivery

      # Two failures that produce NO red signal anywhere, so nothing but a gate
      # will ever surface them. A workflow in a dotless github/workflows/ is
      # invisible to GitHub -- it never runs and so never fails; update-statcan-zev
      # sat there through 46 days of a DAILY schedule. And a fetch without a
      # User-Agent draws HTTP 406 from Overpass, which reads as "upstream is down"
      # rather than "we were refused" -- the Alberta dealer map lost 4 of 5 weekly
      # runs to it while Overpass was healthy the whole time.
      - name: Scheduled jobs can actually run (workflow location + third-party User-Agent)
        run: npm run check:jobs
      # The dealer map may never publish a count it did not read: an output floor
      # plus a >50% collapse refusal on the number actually written, and a lit
      # "Live" badge that only JS may add after a successful read.
      - name: Alberta dealer map never publishes an unread number
        run: npm run test:alberta-dealers
      # A lit "Live" dot must be backed by a read that actually returned. Three
      # surfaces broke this at once by substituting something merely correlated
      # with success: static markup, `!apiUsageLoading` (true after a FAILED
      # read), and `listings.length>0` (never false -- the state is seeded with
      # DEMO_LISTINGS, so it answered "live" over fourteen invented cars).
      - name: A lit Live dot is backed by a successful read
        run: npm run test:live-dot

  # Separate job ON PURPOSE. The gates above are offline and dependency-free, and
  # that is worth protecting -- they run in seconds and a red run always means a
  # real regression. This one needs node_modules (Babel's parser, for real scope
  # analysis), so it installs. Slower and network-bound, but it catches the one
  # class of bug that every other check is blind to: an identifier referenced
  # outside the scope that declares it. That is a runtime ReferenceError, not a
  # build error, and it took the whole scroll view down twice before this existed.
  render-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Undefined identifiers (a green build does NOT catch these)
        run: npm run check:undef
      # Same Babel-scope technique as the check above, pointed at
      # supabase/functions/**/*.ts -- nothing else in this workflow parses
      # that tree at all. A recall-lookup consolidation (4aca3c3, 2026-08-19)
      # truncated several deleted lines to their bare first character and
      # shipped through all 47 other gates; this is the gate that closes it.
      - name: Edge function syntax + scope (regression harness first)
        run: npm run test:edge-syntax
      - name: Edge function syntax + scope (real tree)
        run: npm run check:edge-syntax
      - name: Build must still succeed
        run: npm run build
