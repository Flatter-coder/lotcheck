# Auto-deploy Supabase edge functions on every push to main that touches them.
# Replaces the manual "npx supabase functions deploy ..." PowerShell step.
# One-time setup: add the SUPABASE_ACCESS_TOKEN repo secret
# (GitHub -> Settings -> Secrets and variables -> Actions), generated at
# https://supabase.com/dashboard/account/tokens
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions (retries ride out flaky CDN 522s)
        run: |
          for i in 1 2 3; do
            supabase functions deploy --project-ref debigtyjhjamipooajhk && exit 0
            echo "Deploy attempt $i failed; retrying in 25s..."
            sleep 25
          done
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
