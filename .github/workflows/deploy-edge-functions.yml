# Auto-deploy Supabase edge functions on every push to main that touches them.
# Replaces the manual "npx supabase functions deploy ..." PowerShell step.
# One-time setup: add the SUPABASE_ACCESS_TOKEN repo secret
# (GitHub -> Settings -> Secrets and variables -> Actions), generated at
# https://supabase.com/dashboard/account/tokens
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  # The gates run again HERE, not just in the Gates workflow, because a parallel
  # advisory check doesn't stop anything -- a red gate and a green deploy would
  # race, and the deploy would win. `needs: gates` makes a failing invariant or a
  # non-compliant claim block the push to production outright. They're offline
  # and take seconds, so the cost of running them twice is nil.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:invariants
      - run: npm run check:copy

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Authenticate the CLI-release lookup: unauthenticated GitHub API calls
      # are rate-limited per runner IP, and a busy day of deploys exhausted it
      # ("Failed to resolve latest Supabase CLI release: rate limit exceeded"),
      # failing the deploy before our own retry loop could help.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy all edge functions (retries ride out flaky CDN 522s)
        run: |
          for i in 1 2 3; do
            supabase functions deploy --project-ref debigtyjhjamipooajhk && exit 0
            echo "Deploy attempt $i failed; retrying in 25s..."
            sleep 25
          done
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
