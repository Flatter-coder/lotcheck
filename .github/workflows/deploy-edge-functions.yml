# Auto-deploy Supabase edge functions on every push to main that touches them.
# Replaces the manual "npx supabase functions deploy ..." PowerShell step.
# One-time setup: add the SUPABASE_ACCESS_TOKEN repo secret
# (GitHub -> Settings -> Secrets and variables -> Actions), generated at
# https://supabase.com/dashboard/account/tokens
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref debigtyjhjamipooajhk
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
