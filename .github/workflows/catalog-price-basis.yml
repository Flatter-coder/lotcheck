# One-shot: add the price_basis column and stamp the rows whose freight/PDI
# convention we have actually established.
#   * VW  -> excl_freight  (scrape-vw.mjs derives msrp by subtracting freight)
#   * hand-verified toyota.ca rows -> incl_freight (their $75,450 Land Cruiser
#     1958 is Toyota's $71,670 press figure plus $3,780 freight/PDI)
# Everything else stays NULL = "not established", which makes the report show
# the freight caveat instead of implying a precision we don't have.
name: Catalog price basis (one-shot)

on:
  workflow_dispatch:

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add column and stamp known rows
        run: |
          SQL=$(cat supabase/migrations/20260811_msrp_price_basis.sql)
          SQL="$SQL update msrp_catalog set price_basis='excl_freight' where make ilike 'volkswagen'; update msrp_catalog set price_basis='incl_freight' where source_url like '%toyota.ca%'; delete from listing_analysis_cache;"
          python3 - "$SQL" <<'PY' > payload.json
          import json, sys
          print(json.dumps({"query": sys.argv[1]}))
          PY
          curl -sf -X POST \
            "https://api.supabase.com/v1/projects/debigtyjhjamipooajhk/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
