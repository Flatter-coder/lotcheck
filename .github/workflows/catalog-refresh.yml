name: Catalog refresh — weekly FULL (MSRP + rates)
# Full weekly refresh of msrp_catalog + finance_rate_catalog + lease_rate_catalog
# for ALL makes. MSRP changes ~yearly so weekly is plenty; rates are ALSO kept
# fresh daily by catalog-rates-daily.yml (rates-only). Requires repo secrets
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Without them the scripts dry-run.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 10:00 UTC (~4am Calgary). Full MSRP + rate rewrite.
    - cron: "0 10 * * 1"
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Toyota — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-toyota.mjs
      - name: Lexus — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-lexus.mjs
      - name: Stellantis (Jeep/Ram/Dodge/Chrysler/Fiat) — MSRP + finance/lease
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-stellantis.mjs
      - name: Genesis — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-genesis.mjs
      - name: Hyundai — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-hyundai.mjs
      - name: Mazda — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-mazda.mjs
      - name: Honda — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-honda.mjs
      - name: Acura — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-acura.mjs
      - name: GM (Chevrolet/GMC/Buick/Cadillac) — MSRP only (rates gated)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-gm.mjs
      - name: Ford — MSRP only (rates in separate app)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-ford.mjs
      - name: Ford rates (Convertus dealer feed)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-ford-rates.mjs
      - name: Lincoln — MSRP only
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-lincoln.mjs
      - name: Porsche — MSRP only (no financing exposed)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-porsche.mjs
      - name: MINI — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-mini.mjs
      - name: Mercedes-Benz — MSRP only (rates need estimator capture)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-mercedes.mjs
      - name: Mercedes-Benz rates (SM360 dealer feed)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-mercedes-rates.mjs
      - name: Subaru — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-subaru.mjs
      - name: Kia — MSRP only (rates not exposed as clean API)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-kia.mjs
      - name: Nissan — MSRP only (rates gated GraphQL)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-nissan.mjs
      - name: Nissan rates (Convertus dealer feed)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-nissan-rates.mjs
      - name: Infiniti — MSRP only
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-infiniti.mjs
      - name: Volvo — MSRP only (model-level; per-trim gated)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-volvo.mjs
      - name: Volkswagen — MSRP + finance/lease rates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-vw.mjs
      - name: BMW — MSRP + finance/lease (via SM360 dealer feed)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-bmw.mjs
      - name: Infiniti rates (via SM360 dealer feed)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-infiniti-rates.mjs
      - name: GM rates — Chevrolet/GMC/Buick (via SM360 dealer feed)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-gm-rates.mjs
      - name: Summary
        continue-on-error: true
        if: success()
        run: echo "✅ Catalog refresh complete — $(date)"

      # Cached reports embed catalog-derived MSRP, so a catalog refresh must
      # retire them -- otherwise a corrected figure keeps serving stale (this
      # bit us on 2026-08-11: the catalog was repaired but reports still showed
      # the bad MSRP from cache).
      - name: Invalidate cached reports
        continue-on-error: true
        run: |
          curl -sf -X POST             "https://api.supabase.com/v1/projects/debigtyjhjamipooajhk/database/query"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             -d '{"query":"delete from listing_analysis_cache;"}'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Fault isolation means individual failures no longer abort the run, so
      # they must still be VISIBLE: surface which makes failed. The catalog is
      # better off refreshed for 25 makes with one gap than not refreshed at
      # all -- which is what happened when Genesis crashed on 2026-08-10 and
      # took Hyundai, Mazda, Honda, Acura, GM and Ford down with it.
      - name: Report which makes failed
        if: always()
        run: |
          echo "Individual make steps run with continue-on-error; check the step list above for any red X."
          echo "A red step means that make kept its previous catalog rows -- stale, not wrong."
