# Alberta inventory crawl — our own VIN dataset, from dealers' own public feeds.
#
# THE CRON IS DELIBERATELY COMMENTED OUT. A per-buyer URL read (what production
# does today, on a buyer's instruction, one page) and a standing nightly bulk
# crawl are different activities, and the second is part of what is currently
# with counsel — see legal-brief-url-listing-scraping.md and
# legal-brief-ppr-amvic-access.md. Until that comes back, this runs only when a
# human presses the button.
#
# The crawl HONOURS robots.txt (scripts/lib/robots.mjs): a Disallow on a path we
# read skips that section, a Crawl-delay is obeyed, and an unreadable robots.txt
# skips the dealer for the day. This is the first of the standing-crawl
# guardrails counsel asked about (legal brief Q17) — but honouring robots.txt is
# a guardrail, not the sign-off. The go/no-go on standing bulk crawling is still
# counsel's, and this schedule stays commented out until they clear it.
#
# To enable after sign-off: uncomment the schedule block, and add the
# legal_rule + legal_control rows recording what cleared it.
#
# Cost: free. GitHub-hosted runner, a few hundred JSON fetches, no vendor.
#
# THE INDEX-REBUILD STEP BELOW IS A DIFFERENT ACTIVITY FROM THE CRAWL ABOVE.
# It reads our own vehicle_listing/dealer_source/msrp_catalog and writes our
# own city_dealer_index -- no request ever leaves this job for a dealer site --
# so it is not part of what's with counsel and does not need the same sign-off.
# It only runs after a real (non-dry-run) crawl actually wrote something.
name: Crawl Alberta inventory

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch feeds but write nothing"
        type: boolean
        default: true
      host:
        description: "Re-crawl one dealer only, e.g. https://www.citygm.com (blank = all)"
        type: string
        default: ""
      rebuild_only:
        description: "Skip the crawl; rebuild the price index and daily report from what is already stored"
        type: boolean
        default: false
  schedule:
    # 5am Calgary — after dealers' overnight inventory sync.
    #
    # ENABLED 2026-09-22, after the sign-off this header asked for. The record
    # is in the legal register: legal_rule.rule_key = crawl_scope_dealer_sites_only,
    # with six legal_control rows naming the safeguards (migration 20260922f).
    #
    # THE CLEARANCE IS VERBAL and the rule row says so — its excerpt quotes Vic,
    # not counsel, because there is no written opinion to quote and inventing
    # one would be worse than the gap. The row stays status=draft until a
    # written scope arrives.
    #
    # THE SCOPE IS DEALER WEBSITES ONLY. Facebook, AutoTrader, Kijiji and
    # CarGurus are refused in code before any request is made
    # (scripts/lib/crawl-blocklist.mjs), the run prints what it dropped, and
    # scripts/test-crawl-blocklist.mjs fails the build if the crawler stops
    # consulting the list. A condition enforced only by what happens to be in
    # dealer_source is a condition with nothing behind it.
    # TWICE DAILY (Vic 2026-09-25: every catalogue at 6am and midnight Calgary).
    # 06 and 12 UTC are midnight and 6am MDT (an hour earlier in MST). GitHub
    # starts these hours late, so the exact-time trigger is a separate step.
    - cron: "11 6,12 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Raised with PAGE_CAP: a 60-page lot at an 800ms inter-page delay is ~2
    # minutes on its own, and the cap now allows far larger ones.
    # Raised from 60 with headroom. The two runs before 2026-09-03 were both
    # killed at exactly 60 minutes — the crawl had quietly outgrown its own
    # timeout as the dealer catalogue passed a thousand hosts, and there had
    # been no successful crawl since 08-18 as a result. The real fix is the
    # bounded per-run slice in crawl-alberta-inventory.mjs (--max-dealers,
    # least-recently-crawled first); this is only the margin so a slow batch
    # finishes rather than dying at the wire and writing no second observation.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"      # --experimental-strip-types: the crawler imports validateVin from the edge functions' shared module
      - name: Install
        run: npm install --no-audit --no-fund @supabase/supabase-js
      # ONE AUTHOR FOR "IS THIS A DRY RUN", AND IT IS NOT inputs.
      #
      # inputs.dry_run only exists on a workflow_dispatch. On a schedule event it
      # is the EMPTY STRING, and its two readers disagreed about what that meant:
      # this bash read  "" != "false"  as a dry run, while the write steps below
      # read  !inputs.dry_run  --  !""  --  as NOT a dry run, and ran. So from the
      # day the cron was cleared (2026-09-22) the standing crawl fetched every
      # feed, wrote nothing, and then ran both steps documented as running only
      # after a real crawl. One of them writes.
      #
      # github.event_name is present on every trigger, so it is read first. A
      # schedule IS the standing crawl and writes; a dispatch stays dry unless
      # someone says otherwise. inputs travel via env: instead of being pasted
      # into the shell, so a dispatched value can never become a command.
      - name: Crawl
        id: crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
          HOST_INPUT: ${{ inputs.host }}
          CATALOG_STATUS_OUT: ${{ runner.temp }}/inventory-status.json
          CATALOG_STATUS_FEES_OUT: ${{ runner.temp }}/fees-status.json
          CATALOG_STATUS_COMPARE_OUT: ${{ runner.temp }}/compare-status.json
          REBUILD_INPUT: ${{ inputs.rebuild_only }}
        run: |
          # Rebuild-only (2026-09-25): the 09-25 crawl wrote 17,554 observations
          # and then the price-index step failed, taking the daily report with
          # it. Re-crawling every dealer just to rerun two readers would knock on
          # 31 dealers' sites twice in one day, so the readers can run alone on
          # what is already stored.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REBUILD_INPUT" = "true" ]; then
            echo "rebuild only - no dealer is contacted"
            echo "wrote=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARGS=""
          if [ "$EVENT" = "schedule" ]; then
            DRY=false
            echo "schedule run - the standing crawl writes (cleared 2026-09-22, see header)"
          elif [ "$DRY_INPUT" = "false" ]; then
            DRY=false
            echo "dispatch with dry_run=false - writing"
          else
            DRY=true
            ARGS="$ARGS --dry-run"
            echo "dispatch - dry run (dry_run=${DRY_INPUT:-unset})"
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          if [ -n "$HOST_INPUT" ]; then ARGS="$ARGS --host $HOST_INPUT"; fi
          echo "node scripts/crawl-alberta-inventory.mjs $ARGS"
          node --experimental-strip-types scripts/crawl-alberta-inventory.mjs $ARGS
      # Gated on what the crawl DID, not on what the operator asked for.
      # steps.crawl.outputs.wrote is written by the crawler itself, and is true
      # only when fn_upsert_listings accepted at least one observation row.
      - name: Rebuild city price index
        id: index
        if: ${{ steps.crawl.outputs.wrote == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_STATUS_OUT: ${{ runner.temp }}/maker-vs-dealer.json
        run: node scripts/build-city-price-index.mjs
      # The public daily new/used count (/inventory-daily). Reads today's
      # listing_observation rows this crawl just wrote -- a database fact, not
      # a re-parse of this job's own log -- and applies its own plausibility
      # cap independently of any upstream fix. Same guard as the step above:
      # gated on rows actually accepted, so a report day is never backed by
      # zero reads -- and never skipped on a day we really did read.
      - name: Build Alberta daily inventory report
        if: ${{ steps.crawl.outputs.wrote == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/build-alberta-inventory-daily.mjs

      # A SKIP IS NOT A PASS.
      #
      # The two steps above are gated on a fact now, which means a run that meant
      # to write and wrote nothing would skip them both and finish GREEN -- a
      # silent no-op, which is the shape this repo keeps rediscovering. A dry run
      # is allowed to write nothing. A schedule is not: if the standing crawl
      # reached no dealer, the job did not happen and the run has to say so.
      - name: Guard - a run that meant to write must have written
        if: ${{ always() && steps.crawl.outputs.dry == 'false' && steps.crawl.outputs.wrote != 'true' }}
        run: |
          echo "::error title=Crawl wrote nothing::Not a dry run, and fn_upsert_listings accepted 0 observation rows. The city index and the public daily count were both skipped. Read the Crawl step for the per-dealer reason."
          exit 1
      # The daily report's check mark (20260925_catalog_status.sql). always():
      # a failed refresh is recorded red, never left showing yesterday's green.
      - name: Record catalogue status
        if: ${{ always() && steps.crawl.outputs.dry == 'false' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-catalog-status.mjs --catalog inventory --outcome ${{ steps.crawl.outcome }} --summary "${{ runner.temp }}/inventory-status.json" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # The city price index IS the manufacturer-vs-dealer comparison (live new cars vs MSRP).
      - name: Record catalogue status (manufacturer vs dealer prices)
        if: ${{ always() && steps.crawl.outputs.dry == 'false' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-catalog-status.mjs --catalog maker_vs_dealer --outcome ${{ steps.index.outcome }} --summary "${{ runner.temp }}/maker-vs-dealer.json" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # Dealer fees are read by the same crawl (SM360 dealers state them per car).
      - name: Record catalogue status (dealer fees)
        if: ${{ always() && steps.crawl.outputs.dry == 'false' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-catalog-status.mjs --catalog dealer_fees --outcome ${{ steps.crawl.outcome }} --summary "${{ runner.temp }}/fees-status.json" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # The per-dealer comparison: price beside that dealer's own published fees.
      - name: Record catalogue status (per-dealer comparison)
        if: ${{ always() && steps.crawl.outputs.dry == 'false' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-catalog-status.mjs --catalog price_compare --outcome ${{ steps.crawl.outcome }} --summary "${{ runner.temp }}/compare-status.json" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
