# Alberta inventory crawl — our own VIN dataset, from dealers' own public feeds.
#
# THE CRON IS DELIBERATELY COMMENTED OUT. A per-buyer URL read (what production
# does today, on a buyer's instruction, one page) and a standing nightly bulk
# crawl are different activities, and the second is part of what is currently
# with counsel — see legal-brief-url-listing-scraping.md and
# legal-brief-ppr-amvic-access.md. Until that comes back, this runs only when a
# human presses the button.
#
# To enable after sign-off: uncomment the schedule block, and add the
# legal_rule + legal_control rows recording what cleared it.
#
# Cost: free. GitHub-hosted runner, a few hundred JSON fetches, no vendor.
#
# THE INDEX-REBUILD STEP BELOW IS A DIFFERENT ACTIVITY FROM THE CRAWL ABOVE.
# It reads our own vehicle_listing/dealer_source/msrp_catalog and writes our
# own city_dealer_index -- no request ever leaves this job for a dealer site --
# so it is not part of what's with counsel and does not need the same sign-off.
# It only runs after a real (non-dry-run) crawl actually wrote something.
name: Crawl Alberta inventory

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch feeds but write nothing"
        type: boolean
        default: true
      host:
        description: "Re-crawl one dealer only, e.g. https://www.citygm.com (blank = all)"
        type: string
        default: ""
  # schedule:
  #   - cron: "0 11 * * *"   # 5am Calgary — after dealers' overnight inventory sync
  #   ENABLE ONLY AFTER LEGAL SIGN-OFF (see header)

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Raised with PAGE_CAP: a 60-page lot at an 800ms inter-page delay is ~2
    # minutes on its own, and the cap now allows far larger ones.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"      # --experimental-strip-types: the crawler imports validateVin from the edge functions' shared module
      - name: Install
        run: npm install --no-audit --no-fund @supabase/supabase-js
      - name: Crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" != "false" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.host }}" ]; then ARGS="$ARGS --host ${{ inputs.host }}"; fi
          echo "node scripts/crawl-alberta-inventory.mjs $ARGS"
          node --experimental-strip-types scripts/crawl-alberta-inventory.mjs $ARGS
      - name: Rebuild city price index
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/build-city-price-index.mjs
