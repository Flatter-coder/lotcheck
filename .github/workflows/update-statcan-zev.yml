
name: Update StatCan ZEV data

on:
  schedule:
    # 13:00 UTC daily = 6am Calgary time (7am during daylight saving)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check StatCan for a new release and update the data file
        run: node scripts/update-statcan-zev.mjs

      # THE FILE CHANGES ON EVERY RUN, ON PURPOSE. update-statcan-zev.mjs
      # rewrites last_checked_at even when StatCan has published nothing new,
      # because "we confirmed today that we still hold the latest release" is a
      # claim the map makes and has to be able to back. So this condition is a
      # safety net, not a filter -- it is expected to commit daily, and the
      # quiet branch only fires if the script ever stops recording the check.
      #
      # What protects the CONTENT is in the script: it refuses to write at all
      # if a new release parses to zero regions or a backwards model year,
      # rather than pushing a blank map to main. Nothing reaches this step
      # unless the script exited 0.
      - name: Commit the daily check record (the file changes every run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/statcan-zev.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily StatCan ZEV data check"
            git push
          fi
