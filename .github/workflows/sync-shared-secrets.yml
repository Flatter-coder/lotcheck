# Copy the shared secrets into the Supabase function secrets, and prove them.
#
# STATEMENT_SECRET, INVOICE_INGEST_SECRET and RESEND_WEBHOOK_SECRET are all read
# by EDGE FUNCTIONS, so setting the repo secret alone fixes nothing -- the same
# two-store split that left the Scrapfly key looking fixed while production
# stayed broken.
#
# `npm run key:shared` triggers this automatically. It is also dispatchable on
# its own, to re-apply the repo secrets to Supabase without regenerating them.
#
# IT SENDS NOTHING. founder-statement is verified with a deliberately unknown
# mode, which authenticates and then 400s before the staging or sending
# branches; vendor-invoice-ingest with a malformed body, which authenticates and
# then fails to parse. Both prove the secret and change nothing.
name: Sync shared secrets into Supabase

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Write and verify
        env:
          STATEMENT_SECRET: ${{ secrets.STATEMENT_SECRET }}
          INVOICE_INGEST_SECRET: ${{ secrets.INVOICE_INGEST_SECRET }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/sync-shared-secrets.mjs
