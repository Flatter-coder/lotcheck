name: Update Alberta dealers map data

on:
  schedule:
    # 14:00 UTC Mondays = ~7-8am Calgary. Dealership rosters change slowly, so weekly is plenty.
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Alberta dealer counts from OpenStreetMap
        run: node scripts/update-alberta-dealers.mjs "$(date -u +%Y-%m-%d)"

      - name: Commit if the file changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/alberta-dealers.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly Alberta dealer-map data refresh"
            git push
          fi
